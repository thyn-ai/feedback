name: triage

# Issue forms can only set STATIC labels (the `labels:` key in each template), never a label
# conditional on what the reporter picked in a dropdown -- GitHub has no such mechanism. This
# workflow is the missing piece: it reads the "Which product?" answer out of the rendered issue
# body and applies product:<name>, which is what Phase 3's cross-repo dispatch in codna's webhook
# keys on. Runs on `issues: opened` only -- editing an issue later does not relabel it, so a
# maintainer who changes the product answer should also fix the label by hand.
#
# Safe to run on the shared fleet: no checkout, no execution of anything from the issue body. The
# reporter's text is read as a JS string inside an inline (non-attacker-controlled) script and is
# never passed to a shell -- there is nothing here for a malicious title/body to inject into.
on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label-from-product-field:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - name: Apply product:<name> from the issue form's product dropdown
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const PRODUCT_SLUGS = {
              "algenta": "algenta",
              "codna": "codna",
              "telys": "telys",
              "sqai": "sqai",
              "accounts (billing / login / devices)": "accounts",
              "docs": "docs",
            };
            const body = context.payload.issue.body || "";
            const match = body.match(/###\s*Which product\?\s*\n+\s*([^\n]+)/i);
            const answer = match ? match[1].trim() : null;
            const slug = answer ? PRODUCT_SLUGS[answer] : null;

            if (!slug) {
              core.info(`no recognised product answer (got: ${JSON.stringify(answer)}) -- leaving unlabelled for a human to triage`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [`product:${slug}`],
            });
            core.info(`labelled #${context.payload.issue.number} as product:${slug}`);
