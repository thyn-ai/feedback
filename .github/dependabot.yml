# Dependabot configuration.
#
# This repository ships no code and has no package manifests: the only dependencies Dependabot can
# see are the SHA-pinned actions in .github/workflows/*.yml, so the github-actions entry below is
# the whole configuration.
#
# `cooldown: default-days: 7`: a version bump is proposed only once the release is a week old, so a
# compromised or hastily-yanked upload is caught upstream before it reaches a PR here (Dependabot's
# own default is 3 days). Security updates are never delayed by cooldown.
version: 2
updates:
  # GitHub Actions: weekly, grouped into one PR -- the same action is pinned by SHA at several call
  # sites, and one grouped bump is reviewable where a handful of single-action PRs would not be.
  # thyn-ai/security-toolchain is excluded: its own propagate.py is the one bumper for that pin
  # (it moves the CI pin and the pre-commit `rev` together and carries required caller
  # `permissions:` forward when a release adds one; a routine digest bump would not). Dependabot
  # names a reusable-workflow dependency by its full path, hence the wildcard.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "thyn-ai/security-toolchain*"
    commit-message:
      prefix: chore(ci)
